name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -l {0}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Miniconda (Python 3.11)
        uses: conda-incubator/setup-miniconda@v3
        with:
          python-version: "3.11"
          activate-environment: smartphone-addiction
          auto-update-conda: false

      - name: Install package with analysis/dev/tools extras
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[analysis,dev,tools]"

      - name: Ruff format check
        run: python -m ruff format --check .

      - name: Ruff lint
        run: python -m ruff check .

      # Notebooks are excluded from Ruff (see pyproject.toml) but must stay output-free.

      - name: Pytest (exclude slow) and guard reports/
        run: |
          before="$(mktemp)"
          bash scripts/check_reports_unchanged.sh snapshot "$before"
          python -m pytest -m "not slow" -q
          bash scripts/check_reports_unchanged.sh check "$before"
          rm -f "$before"

      - name: Build wheel
        run: python -m build

      - name: Ensure notebooks have no outputs
        run: |
          python - <<'PY'
          import json, sys
          from pathlib import Path
          bad = []
          for path in list(Path("notebooks").glob("*.ipynb")) + list(Path("kaggle").glob("*.ipynb")):
              nb = json.loads(path.read_text(encoding="utf-8"))
              for cell in nb.get("cells", []):
                  if cell.get("cell_type") == "code" and cell.get("outputs"):
                      bad.append(str(path))
                      break
                  if cell.get("execution_count") not in (None, 0):
                      bad.append(str(path))
                      break
          if bad:
              print("notebooks still have outputs:", bad)
              sys.exit(1)
          print("notebooks clean")
          PY

      - name: detect-secrets
        run: |
          # Use the pre-commit hook entrypoint: fails on new secrets and does
          # not rewrite .secrets.baseline (unlike `detect-secrets scan --baseline`).
          python - <<'PY'
          import subprocess
          import sys
          from detect_secrets.pre_commit_hook import main

          files = subprocess.check_output(["git", "ls-files"], text=True).splitlines()
          raise SystemExit(main(["--baseline", ".secrets.baseline", *files]))
          PY

      - name: Forbid tracked competition artifacts
        run: |
          python - <<'PY'
          import re, subprocess, sys
          pattern = re.compile(
              r"(^data/raw/.*\.csv$|kaggle\.json$|access_token$|^artifacts/|^submissions/|\.cbm$|\.joblib$|\.parquet$)"
          )
          files = subprocess.check_output(["git", "ls-files"], text=True).splitlines()
          bad = [path for path in files if pattern.search(path)]
          if bad:
              print("tracked forbidden paths:")
              print("\n".join(bad))
              sys.exit(1)
          print("tracked tree looks clean")
          PY

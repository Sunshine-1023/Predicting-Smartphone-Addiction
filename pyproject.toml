[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "smartphone-addiction"
version = "0.1.0"
description = "Reproducible Kaggle pipeline for Predicting Smartphone Addiction"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }
dependencies = [
  "catboost>=1.2,<2",
  "joblib>=1.3,<2",
  "lightgbm>=4.3,<5",
  "numpy>=1.26,<3",
  "optuna>=4,<5",
  "pandas>=2.2,<3",
  "pyarrow>=16,<22",
  "pydantic>=2.7,<3",
  "pyyaml>=6,<7",
  "scikit-learn>=1.5,<2",
  "tqdm>=4.66,<5",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
analysis = [
  "ipykernel>=6,<7",
  "jupyterlab>=4,<5",
  "matplotlib>=3.9,<4",
  "seaborn>=0.13,<1",
]
dev = [
  "build>=1.2,<2",
  "hatchling>=1.25,<2",
  "detect-secrets>=1.5,<2",
  "nbstripout>=0.7,<1",
  "pre-commit>=3.7,<5",
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
]
tools = [
  "kaggle>=1.6,<2",
]
neural = [
  "torch>=2.5,<3",
]

[project.scripts]
smartphone-addiction = "smartphone_addiction.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/smartphone_addiction"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "model: CatBoost or LightGBM adapter test",
  "slow: full-data or long-running test",
  "neural: optional PyTorch / MPS reconstruction test",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
  "notebooks",
  "kaggle",
  "plan",
  ".venv",
  "dist",
  "artifacts",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Typer requires Option()/Argument() calls in function defaults.
"src/smartphone_addiction/cli.py" = ["B008"]
"scripts/verify_environment.py" = ["SIM103"]
"scripts/write_data_validation_report.py" = ["E402"]
"tests/unit/test_neural_*.py" = ["E402"]
"tests/unit/test_autoencoder.py" = ["E402"]
"tests/unit/test_tabm_encoder.py" = ["E402"]
"tests/integration/test_reconstruction_pipeline.py" = ["E402"]
"tests/integration/test_latent_export_alignment.py" = ["E402"]

# LightGBM masked-v3 + fold-native missing-only imputation (gate-2 redo).
# Uses encoder_f inside each LightGBM fold; averages test probabilities, not latents.
features:
  groups:
    - raw
    - missingness
    - behavioral_totals
    - behavioral_deltas
    - log_counts
  exclude_columns:
    - missing_pattern
  masking:
    enabled: true
    fraction: 0.20
    fields: core5
    compatible_sources: false
    sample_weight: false
  neural_encoder:
    reconstruction_run: artifacts/reconstruction/20260815T170953Z-mlp-mae-c7fbc69  # pragma: allowlist secret
    include:
      - imputed_core
    device: mps
model:
  name: lightgbm
  params:
    n_estimators: 3000
    num_leaves: 95
    learning_rate: 0.05
    min_child_samples: 200
    max_bin: 1023
    reg_alpha: 1.0
    reg_lambda: 10.0
    path_smooth: 5.0
    early_stopping_rounds: 100
    n_jobs: 4

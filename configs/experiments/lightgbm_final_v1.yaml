# LightGBM finalist placeholder (fill params after Optuna + full CV selection).
# Intended usage:
#   smartphone-addiction train \
#     --profile configs/profiles/final.yaml \
#     --model-config configs/models/lightgbm.yaml \
#     --experiment configs/experiments/lightgbm_final_v1.yaml
features:
  groups:
    - raw
    - missingness
    - behavioral_totals
    - behavioral_ratios
    - behavioral_deltas
    - log_counts
    - categorical_interactions
model:
  name: lightgbm
  params:
    # Replace with the selected candidate after full 5-fold re-evaluation.
    n_estimators: 2000
    num_leaves: 63
    learning_rate: 0.05
    min_child_samples: 20
    early_stopping_rounds: 100
    n_jobs: 4

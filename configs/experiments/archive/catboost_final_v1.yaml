# CatBoost finalist placeholder (fill params after Optuna + full CV selection).
# Intended usage:
#   smartphone-addiction train \
#     --profile configs/profiles/final.yaml \
#     --model-config configs/models/catboost.yaml \
#     --experiment configs/experiments/archive/catboost_final_v1.yaml
features:
  groups:
    - raw
    - missingness
    - behavioral_totals
    - behavioral_ratios
    - behavioral_deltas
    - log_counts
    - categorical_interactions
model:
  name: catboost
  params:
    # Replace with the selected candidate after full 5-fold re-evaluation.
    iterations: 2000
    depth: 6
    learning_rate: 0.05
    l2_leaf_reg: 3.0
    early_stopping_rounds: 100
    thread_count: 4
